<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baqyla — видеонаблюдение в Уральске</title>
  <meta name="description" content="Монтаж видеонаблюдения в Уральске для дома, бизнеса и крестьянского хозяйства. Отметьте камеры на плане — стоимость посчитается сразу.">
  <meta property="og:title" content="Baqyla — видеонаблюдение в Уральске">
  <meta property="og:description" content="Отметьте камеры на плане — стоимость посчитается сразу.">
  <meta property="og:image" content="assets/og.jpg">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&text=BAQYL&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="top">
    <div class="wide top__in">
      <a class="brand" href="index.html" aria-label="Baqyla — на главную">
        <img src="assets/mark.png" alt="" width="34" height="34">
        <span class="brand__word">BA<b>Q</b>YLA</span>
      </a>
      <nav class="nav" aria-label="Разделы">
        <a href="index.html" aria-current="page">Расчёт</a>
        <a href="kits.html">Комплекты</a>
      </nav>
      <a class="top__phone" href="tel:+77089804260">+7 708 980 42 60</a>
      <a class="btn btn--wa btn--sm top__wa" href="https://wa.me/77089804260" target="_blank" rel="noopener" aria-label="Написать в WhatsApp"><span>WhatsApp</span></a>
    </div>
  </header>

  <main>
    <section class="hero wide">
      <h1>Расчёт стоимости</h1>
    </section>

    <section id="calc" class="calc wide" aria-label="Расчёт стоимости">
      <div class="wiz" id="wiz">
        <nav class="steps-bar" id="stepsBar" aria-label="Шаги расчёта"></nav>
        <div class="q-row">
          <h2 class="q" id="q" tabindex="-1"></h2>
          <p class="hint" id="hint" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-.5V9a1.5 1.5 0 0 1 3 0v1.5m0 0a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.2a5 5 0 0 1-3.9-1.9L4.6 16a1.5 1.5 0 0 1 2.3-1.9L9 16.5V11"/></svg>Нажмите на карточку</p>
        </div>
        <div id="stepBody"></div>
        <div class="wiz__nav">
          <button type="button" class="btn btn--ghost" id="back">Назад</button>
          <button type="button" class="btn btn--primary" id="next">Дальше</button>
        </div>
      </div>

      <aside class="smeta" aria-live="polite">
        <div class="smeta__head">
          <div class="smeta__title">Предварительная смета</div>
          <button type="button" class="smeta__link" id="reset" hidden>Начать заново</button>
        </div>
        <div id="lines" class="smeta__lines"></div>
        <div class="smeta__total">
          <span>Итого под ключ</span>
          <strong id="total">0 ₸</strong>
        </div>
        <p class="smeta__note">Цена предварительная — точную сумму назовём после осмотра объекта.</p>
        <a class="btn btn--wa btn--block" id="send" href="#" target="_blank" rel="noopener">Отправить расчёт в WhatsApp</a>
        <a class="btn btn--ghost btn--block" href="tel:+77089804260">Позвонить</a>
        <button type="button" class="smeta__share" id="share" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4L12 18.4"/></svg>Поделиться расчётом</button>
      </aside>
    </section>
  </main>

  <div class="mbar" aria-hidden="true">
    <div><small>Итого</small><strong id="mTotal">0 ₸</strong></div>
    <a class="btn btn--wa btn--sm" id="mSend" href="#" target="_blank" rel="noopener" tabindex="-1">В WhatsApp</a>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
